name: Build APK Nuvio Fluide

on:
  workflow_dispatch:
  push:
    branches: [fluide]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Fichier local.properties vide
        run: touch local.properties
      - name: Clé de signature fixe (mises à jour sans désinstaller)
        shell: bash
        env:
          KS: ${{ secrets.FLUIDE_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then printf '%s' "$KS" | base64 -d > ~/.android/debug.keystore; else cp ci/fluide-signing.jks ~/.android/debug.keystore; fi
          echo "FLUIDE_STORE_FILE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          # Numéro de version toujours croissant : Android accepte la mise à jour par-dessus.
          echo "FLUIDE_VERSION_CODE=$((145000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
      - name: Configuration officielle (compte, TMDB, Trakt)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: |
          bash ci/extract-official-config.sh "$RUNNER_TEMP/official.env"
          cat "$RUNNER_TEMP/official.env" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/official.env" >> local.properties
      - name: Compilation de l'APK (fullDebug, universel)
        shell: bash
        run: |
          set +e
          ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            { grep -E "^e: " build.log | head -8; grep -A6 "What went wrong" build.log | tr '\n' ' ' | cut -c1-900; } | while IFS= read -r line; do echo "::error::${line:0:900}"; done
          fi
          exit $status
      - name: Vérification de la signature
        shell: bash
        run: |
          apk=$(ls androidApp/build/outputs/apk/full/debug/*.apk | head -1)
          bt=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "::notice::APK $(basename $apk) versionCode=$FLUIDE_VERSION_CODE — $($bt/apksigner verify --print-certs $apk | grep -m1 SHA-256)"
      - uses: actions/upload-artifact@v7
        with:
          name: Nuvio-Fluide-APK
          path: androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
